services:
  podcastai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podcastai
    ports:
      - "8000:8000"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./samples:/app/samples
    restart: unless-stopped

